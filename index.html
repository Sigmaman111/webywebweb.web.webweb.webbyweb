<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Game Hub</title>

<style>
    body {
        margin: 0;
        padding: 30px;
        background: #1a1a1a;
        color: white;
        font-family: Arial;
    }

    h1 {
        text-align: center;
        font-size: 42px;
        margin-bottom: 25px;
    }

    .search-container {
        width: 100%;
        max-width: 600px;
        margin: auto;
        text-align: center;
    }

    input {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: none;
        font-size: 18px;
    }

    .results-container {
        margin-top: 12px;
        width: 100%;
    }

    .result-box {
        background: #222;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 12px;
        cursor: pointer;
        text-align: left;
        transition: 0.2s;
        display: flex;
        align-items: center;
    }

    .result-box:hover {
        background: #333;
    }

    .result-img {
        width: 90px;
        height: 90px;
        border-radius: 8px;
        object-fit: cover;
        margin-right: 15px;
    }

    .result-title {
        font-size: 22px;
        margin: 0;
    }
</style>
</head>

<body>

<h1>GAME HUB</h1>

<div class="search-container">
    <input id="searchBar" type="text" placeholder="Search a game..." oninput="showResults()">
    <div id="resultsContainer" class="results-container"></div>
</div>

<script>
// LIST OF GAMES
const games = [
    {
        name: "cookie clicker",
        link: "games/cookie-clicker/index.html",
        image: "games/cookie-clicker/thumbnail.png"
    },
    {
        name: "game one",
        link: "games/game1/index.html",
        image: "games/game1/thumbnail.png"
    },
    {
        name: "game two",
        link: "games/game2/index.html",
        image: "games/game2/thumbnail.png"
    }
];

// SHOW PARTIAL SEARCH RESULTS
function showResults() {
    const text = document.getElementById("searchBar").value.toLowerCase().trim();
    const container = document.getElementById("resultsContainer");

    container.innerHTML = "";

    if (text === "") return;

    const matches = games.filter(g => g.name.toLowerCase().includes(text));

    if (matches.length === 0) return;

    matches.forEach(game => {
        const box = document.createElement("div");
        box.className = "result-box";
        box.onclick = () => window.location.href = game.link;

        box.innerHTML = `
            <img class="result-img" src="${game.image}">
            <h3 class="result-title">${game.name}</h3>
        `;
        container.appendChild(box);
    });
}
</script>

</body>
</html>
