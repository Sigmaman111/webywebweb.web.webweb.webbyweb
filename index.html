<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Hub</title>

<!-- Styling -->
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #1a1a1a, #2b2b2b);
        color: white;
        text-align: center;
    }

    header {
        padding: 20px;
        font-size: 32px;
        font-weight: bold;
        background: #111;
        letter-spacing: 2px;
    }

    .container {
        margin-top: 80px;
    }

    .title {
        font-size: 52px;
        margin-bottom: 20px;
    }

    .subtitle {
        font-size: 20px;
        opacity: 0.8;
        margin-bottom: 40px;
    }

    .search-box {
        display: flex;
        justify-content: center;
        gap: 10px;
    }

    input {
        padding: 12px;
        width: 320px;
        border-radius: 8px;
        border: none;
        font-size: 16px;
    }

    button {
        padding: 12px 20px;
        font-size: 16px;
        background: #ff3d7f;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        color: white;
        transition: 0.25s;
    }

    button:hover {
        background: #ff5b97;
    }
</style>
</head>

<body>

<header>GAME HUB</header>

<div class="container">
    <div class="title">Welcome to Game Hub</div>
    <div class="subtitle">Play, explore, and discover new games</div>

    <div class="search-box">
        <input id="searchInput" type="text" placeholder="Search for a game...">
        <button onclick="goToSearch()">Search</button>
    </div>
</div>

<!-- JavaScript -->
<script>
function goToSearch() {
    const query = document.getElementById("searchInput").value;
    
    // URL of your GitHub Pages search site
    // Example: https://yourname.github.io/games/search.html
    const githubBase = "https://YOUR-USERNAME.github.io/YOUR-REPO/search.html";

    // Redirect with ?q= parameter
    window.location.href = githubBase + "?q=" + encodeURIComponent(query);
}
</script>

</body>
</html>
