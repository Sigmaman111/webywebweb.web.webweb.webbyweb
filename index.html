<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Game Hub</title>

<style>
    body {
        margin: 0;
        padding: 30px;
        background: #1a1a1a;
        color: white;
        font-family: Arial;
    }

    .search-container {
        width: 100%;
        max-width: 600px;
        margin: auto;
        text-align: center;
    }

    input {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: none;
        font-size: 18px;
    }

    .result-box {
        margin-top: 12px;
        background: #222;
        border-radius: 10px;
        padding: 15px;
        display: none;
        cursor: pointer;
        text-align: left;
        transition: 0.2s;
    }

    .result-box:hover {
        background: #333;
    }

    .result-img {
        width: 90px;
        height: 90px;
        border-radius: 8px;
        object-fit: cover;
        float: left;
        margin-right: 12px;
    }

    .result-title {
        font-size: 22px;
        margin: 0;
        padding-top: 10px;
    }
</style>
</head>

<body>

<div class="search-container">
    <input id="searchBar" type="text" placeholder="Search a game..." oninput="showResult()">

    <div id="resultBox" class="result-box" onclick="openGame()">
        <img id="resultImg" class="result-img">
        <h3 id="resultTitle" class="result-title"></h3>
    </div>
</div>

<script>
// LIST OF GAMES
const games = [
    {
        name: "cookie clicker",
        link: "games/cookie-clicker/index.html",
        image: "games/cookie-clicker/thumbnail.png"
    },
    {
        name: "game one",
        link: "games/game1/index.html",
        image: "games/game1/thumbnail.png"
    },
    {
        name: "game two",
        link: "games/game2/index.html",
        image: "games/game2/thumbnail.png"
    }
];

let currentLink = "";

// SEARCH FUNCTION
function showResult() {
    const text = document.getElementById("searchBar").value.toLowerCase().trim();
    const box = document.getElementById("resultBox");

    if (text === "") {
        box.style.display = "none";
        return;
    }

    const match = games.find(g => g.name.startsWith(text));

    if (match) {
        document.getElementById("resultImg").src = match.image;
        document.getElementById("resultTitle").textContent = match.name;
        currentLink = match.link;
        box.style.display = "block";
    } else {
        box.style.display = "none";
    }
}

// OPEN GAME ON CLICK
function openGame() {
    if (currentLink) {
        window.location.href = currentLink;
    }
}
</script>

</body>
</html>
