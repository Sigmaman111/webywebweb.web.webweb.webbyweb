<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Hub</title>

<style>
    body {
        margin: 0;
        background: linear-gradient(135deg, #090909, #1a1a1a);
        color: #fff;
        font-family: "Segoe UI", Arial, sans-serif;
        overflow-x: hidden;
    }

    header {
        padding: 50px 0 20px 0;
        text-align: center;
        animation: fadeIn 1.2s ease;
    }

    h1 {
        margin: 0;
        font-size: 55px;
        letter-spacing: 3px;
        font-weight: 700;
        text-shadow: 0 0 20px #00eaff;
    }

    p.subtitle {
        margin-top: 10px;
        font-size: 20px;
        opacity: 0.9;
        text-shadow: 0 0 10px #0088aa;
    }

    /* Search box */
    #search {
        display: block;
        margin: 25px auto;
        width: 55%;
        padding: 15px 20px;
        font-size: 18px;
        border-radius: 12px;
        border: none;
        outline: none;
        color: white;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(8px);
        transition: 0.25s;
    }

    #search:focus {
        background: rgba(255, 255, 255, 0.13);
        box-shadow: 0 0 12px #00eaff;
    }

    /* Results grid */
    #results {
        margin-top: 40px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 25px;
        padding-bottom: 60px;
    }

    /* Game card */
    .game-card {
        width: 220px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 14px;
        border-radius: 15px;
        cursor: pointer;
        backdrop-filter: blur(6px);
        transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    .game-card:hover {
        transform: translateY(-6px) scale(1.03);
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 18px #00eaffaa;
    }

    .game-card img {
        width: 100%;
        border-radius: 12px;
        box-shadow: 0 0 12px #0008;
    }

    .game-card p {
        margin-top: 12px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-shadow: 0 0 8px #00ddee;
    }

    /* Fade animation */
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-20px); }
        to   { opacity: 1; transform: translateY(0); }
    }
</style>

</head>
<body>

<header>
    <h1>Game Hub</h1>
    <p class="subtitle">Search and play your favourite web games</p>
</header>

<input id="search" type="text" placeholder="Search games…">

<div id="results"></div>

<script>
/* ===== GAME LIST ===== */
const games = [
    { name: "Cookie Clicker", page: "https://sigmaman111.github.io/webywebweb.web.webweb.webbyweb/games/cookie-clicker.html", image: "assets/cookie-clicker.png" },
    { name: "Slope", page: "games/slope.html", image: "assets/slope.png" },
    { name: "Moto X3M", page: "games/moto-x3m.html", image: "assets/moto-x3m.png" },
    { name: "Clicking Madness", page: "games/clicking-madness.html", image: "assets/clicking-madness.png" }
];

/* ===== SEARCH FUNCTION ===== */
document.getElementById("search").addEventListener("input", function () {
    const query = this.value.toLowerCase().trim();
    const resultsDiv = document.getElementById("results");

    resultsDiv.innerHTML = "";

    if (query === "") return;

    const filtered = games.filter(g => g.name.toLowerCase().includes(query));

    filtered.forEach(game => {
        const card = document.createElement("div");
        card.className = "game-card";
        card.innerHTML = `
            <img src="${game.image}">
            <p>${game.name}</p>
        `;
        card.onclick = () => window.location.href = game.page;
        resultsDiv.appendChild(card);
    });
});
</script>

</body>
</html>
