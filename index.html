<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Hub</title>
<style>
    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    header {
        padding: 30px 0;
    }

    h1 {
        margin: 0;
        font-size: 42px;
    }

    p.subtitle {
        margin: 5px 0 25px 0;
        font-size: 18px;
        opacity: 0.8;
    }

    #search {
        width: 60%;
        padding: 14px;
        font-size: 18px;
        border-radius: 8px;
        border: none;
        outline: none;
    }

    #results {
        margin-top: 30px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        padding-bottom: 50px;
    }

    .game-card {
        width: 200px;
        background: #222;
        padding: 12px;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.2s;
    }

    .game-card:hover {
        background: #333;
        transform: scale(1.05);
    }

    .game-card img {
        width: 100%;
        border-radius: 10px;
    }

    .game-card p {
        margin-top: 10px;
        font-size: 16px;
    }
</style>
</head>
<body>

<header>
    <h1>Game Hub</h1>
    <p class="subtitle">Search and play your favourite web games</p>
</header>

<input id="search" type="text" placeholder="Search games…">

<div id="results"></div>

<script>
/* ===== GAME LIST ===== */
const games = [
    { name: "Cookie Clicker", page: "https://sigmaman111.github.io/webywebweb.web.webweb.webbyweb/games/cookie-clicker.html", image: "assets/cookie-clicker.png" },
    { name: "Slope", page: "games/slope.html", image: "assets/slope.png" },
    { name: "Moto X3M", page: "games/moto-x3m.html", image: "assets/moto-x3m.png" },
    { name: "Clicking Madness", page: "games/clicking-madness.html", image: "assets/clicking-madness.png" }
];

/* ===== SEARCH FUNCTION ===== */
document.getElementById("search").addEventListener("input", function () {
    const query = this.value.toLowerCase().trim();
    const resultsDiv = document.getElementById("results");

    resultsDiv.innerHTML = ""; // Clear previous results

    if (query === "") return;

    const filtered = games.filter(g => g.name.toLowerCase().includes(query));

    filtered.forEach(game => {
        const card = document.createElement("div");
        card.className = "game-card";
        card.innerHTML = `
            <img src="${game.image}">
            <p>${game.name}</p>
        `;
        card.onclick = () => window.location.href = game.page;
        resultsDiv.appendChild(card);
    });
});
</script>

</body>
</html>
