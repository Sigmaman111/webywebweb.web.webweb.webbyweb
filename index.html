<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Hub</title>

<style>
    body {
        margin: 0;
        background: linear-gradient(135deg, #090909, #1a1a1a);
        color: #fff;
        font-family: "Segoe UI", Arial, sans-serif;
        overflow-x: hidden;
    }

    header {
        padding: 50px 0 10px 0;
        text-align: center;
        animation: fadeIn 1.2s ease;
    }

    h1 {
        margin: 0;
        font-size: 55px;
        letter-spacing: 3px;
        font-weight: 700;
        text-shadow: 0 0 20px #ff4444;
    }

    p.subtitle {
        margin-top: 10px;
        font-size: 20px;
        opacity: 0.9;
        text-shadow: 0 0 10px #cc2222;
    }

    /* Tabs */
    .tabs {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        gap: 25px;
        font-size: 18px;
    }

    .tab {
        cursor: pointer;
        padding: 10px 20px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        transition: 0.25s;
    }

    .tab.active {
        background: #ff4444;
        color: black;
        font-weight: bold;
    }

    .tab:hover:not(.active)) {
        background: rgba(255, 255, 255, 0.13);
    }

    /* Search box */
    #search {
        display: block;
        margin: 25px auto;
        width: 55%;
        padding: 15px 20px;
        font-size: 18px;
        border-radius: 12px;
        border: none;
        outline: none;
        color: white;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(8px);
        transition: 0.25s;
    }

    #search:focus {
        background: rgba(255, 255, 255, 0.13);
        box-shadow: 0 0 12px #ff4444;
    }

    /* Results grid */
    #results {
        margin-top: 40px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 25px;
        padding-bottom: 60px;
    }

    /* Game card */
    .game-card {
        width: 220px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 14px;
        border-radius: 15px;
        cursor: pointer;
        backdrop-filter: blur(6px);
        transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
        position: relative;
    }

    .game-card:hover {
        transform: translateY(-6px) scale(1.03);
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 18px #ff4444aa;
    }

    .game-card img {
        width: 100%;
        border-radius: 12px;
        box-shadow: 0 0 12px #0008;
    }

    .game-card p {
        margin-top: 12px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-shadow: 0 0 8px #ff6666;
    }

    /* Favourite star */
    .star {
        position: absolute;
        top: 10px;
        right: 12px;
        font-size: 26px;
        cursor: pointer;
        transition: 0.2s;
        user-select: none;
    }

    .star.fav {
        color: gold;
        text-shadow: 0 0 8px gold;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-20px); }
        to   { opacity: 1; transform: translateY(0); }
    }
</style>

</head>
<body>

<header>
    <h1>Game Hub</h1>
    <p class="subtitle">Search and play your favourite web games</p>
    <p< class="text">>Site Version: 1.2</p>
</header>

<!-- Tabs -->
<div class="tabs">
    <div class="tab active" id="tab-all">All Games</div>
    <div class="tab" id="tab-fav">Favourites</div>
</div>

<input id="search" type="text" placeholder="Search games…">

<div id="results"></div>

<script>
/* ===== GAME LIST ===== */
const games = [
    { name: "Cookie Clicker", page: "https://sigmaman111.github.io/webywebweb.web.webweb.webbyweb/games/cookie-clicker.html", image: "https://learncodingdaily.com/images/games/cookieclicker-min.png" },
    { name: "Slope", page: "https://sigmaman111.github.io/webywebweb.web.webweb.webbyweb/games/slope.html", image: "https://learncodingdaily.com/images/games/slope-min.jpg" },
    { name: "Moto X3M", page: "games/moto-x3m.html", image: "https://learncodingdaily.com/images/games/motox3m-min.jpg" },
    { name: "Poly Track", page: "games/polytrack.html", image: "https://learncodingdaily.com/images/games/polytrack-min.jpg" },
    { name: "Police Chase", page: "games/policechase.html", image: "https://learncodingdaily.com/images/games/policechase-min.png" }
];

/* ===== FAVOURITES SYSTEM ===== */
let favourites = JSON.parse(localStorage.getItem("favourites")) || [];

function toggleFavourite(gameName) {
    if (favourites.includes(gameName)) {
        favourites = favourites.filter(f => f !== gameName);
    } else {
        favourites.push(gameName);
    }
    localStorage.setItem("favourites", JSON.stringify(favourites));
    renderGames();
}

function isFavourite(name) {
    return favourites.includes(name);
}

/* ===== RENDERING ===== */
let currentTab = "all";

document.getElementById("tab-all").onclick = () => {
    currentTab = "all";
    setActiveTab();
    renderGames();
};

document.getElementById("tab-fav").onclick = () => {
    currentTab = "fav";
    setActiveTab();
    renderGames();
};

function setActiveTab() {
    document.getElementById("tab-all").classList.toggle("active", currentTab === "all");
    document.getElementById("tab-fav").classList.toggle("active", currentTab === "fav");
}

/* Render cards */
function renderGames() {
    const query = document.getElementById("search").value.toLowerCase().trim();
    const resultsDiv = document.getElementById("results");
    resultsDiv.innerHTML = "";

    let list = games;

    if (currentTab === "fav") {
        list = list.filter(g => favourites.includes(g.name));
    }

    if (query) {
        list = list.filter(g => g.name.toLowerCase().includes(query));
    }

    list.forEach(game => {
        const card = document.createElement("div");
        card.className = "game-card";
        card.innerHTML = `
            <span class="star ${isFavourite(game.name) ? "fav" : ""}" onclick="event.stopPropagation(); toggleFavourite('${game.name}')">
                ★
            </span>
            <img src="${game.image}">
            <p>${game.name}</p>
        `;
        card.onclick = () => window.location.href = game.page;
        resultsDiv.appendChild(card);
    });
}

renderGames();

/* ===== SEARCH HANDLER ===== */
document.getElementById("search").addEventListener("input", renderGames);
</script>

</body>
</html>
